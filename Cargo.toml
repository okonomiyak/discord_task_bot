[workspace]
# cli/ は宿題ボードを操作する CLI（hw コマンド）。ボット本体のビルドには含まれない
members = [".", "cli"]

[package]
name = "discord_task_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
dotenvy = "0.15"
chrono-tz = "0.10"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
