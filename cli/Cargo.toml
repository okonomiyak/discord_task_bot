[package]
name = "hw-cli"
version = "0.1.0"
edition = "2024"
description = "宿題ボード（discord_task_bot の Web ダッシュボード）を操作する CLI"

[[bin]]
name = "hw"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
